name: Validate Love Home

on:
  push:
    branches: [main, codex/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Validate media Worker
        run: |
          npm ci --prefix workers/media
          npm test --prefix workers/media
          npm run typecheck --prefix workers/media

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate production site
        run: npm run generate
