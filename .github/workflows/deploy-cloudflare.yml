name: Deploy Love Home to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
      NUXT_PUBLIC_MEDIA_STORAGE_PROVIDER: ${{ vars.NUXT_PUBLIC_MEDIA_STORAGE_PROVIDER }}
      NUXT_PUBLIC_MEDIA_WORKER_URL: ${{ vars.NUXT_PUBLIC_MEDIA_WORKER_URL }}
      NUXT_PUBLIC_APP_BUILD: ${{ github.sha }}
      NUXT_PUBLIC_UPDATE_MANIFEST_URL: ${{ vars.NUXT_PUBLIC_UPDATE_MANIFEST_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Stage Android APK from this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_APK_RELEASE_TAG: ${{ vars.APP_APK_RELEASE_TAG }}
        run: |
          if [[ -z "$APP_APK_RELEASE_TAG" ]]; then
            echo 'No Android release configured. Deploying the web app only.'
            exit 0
          fi

          apk_dir="$(mktemp -d)"
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern "Love小家-latest.apk" --dir "$apk_dir" -- "$APP_APK_RELEASE_TAG"; then
            mkdir -p public/downloads
            cp "$apk_dir/Love小家-latest.apk" public/downloads/
          else
            echo '::warning::The configured release APK could not be downloaded. Deploying the web app only.'
          fi

      - name: Write update manifest
        env:
          APP_UPDATE_NOTES: ${{ vars.APP_UPDATE_NOTES }}
          APP_UPDATE_PUBLISHED_AT: ${{ github.event.head_commit.timestamp || '' }}
          APP_UPDATE_BASE_URL: ${{ vars.APP_UPDATE_BASE_URL }}
        run: npm run update:manifest

      - name: Generate static site
        run: npm run generate

      - name: Prepare official landing deployment
        run: |
          mkdir -p .output/landing-public
          cp public/official/index.html .output/landing-public/index.html
          cp .output/public/app-update.json .output/landing-public/
          if [[ -f .output/public/downloads/Love小家-latest.apk ]]; then
            mkdir -p .output/landing-public/downloads
            cp .output/public/downloads/Love小家-latest.apk .output/landing-public/downloads/
          fi
          printf '/*\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n' > .output/landing-public/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=love-home --branch=main

      - name: Deploy official landing page
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/landing-public --project-name=love-landing --branch=main
